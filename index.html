<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌 Logo 素材庫</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#fafafa; --card:#fff; --text:#1a1a1a; --muted:#6b6b6b;
    --border:#e5e5e5; --accent:#2563eb; --accent-hover:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121212; --card:#1c1c1c; --text:#f0f0f0; --muted:#9a9a9a;
      --border:#333; --accent:#60a5fa; --accent-hover:#3b82f6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121212; --card:#1c1c1c; --text:#f0f0f0; --muted:#9a9a9a;
    --border:#333; --accent:#60a5fa; --accent-hover:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px 16px 100px;
  }
  .wrap{max-width:1000px; margin:0 auto;}
  h1{font-size:1.4rem; margin-bottom:4px;}
  p.sub{color:var(--muted); margin-top:0; font-size:0.9rem;}
  .head-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:16px; flex-wrap:wrap;
  }
  .claude-link{
    flex-shrink:0; white-space:nowrap;
    background:var(--accent); color:#fff; text-decoration:none;
    padding:10px 16px; border-radius:8px; font-size:0.85rem; font-weight:600;
  }
  .claude-link:hover{ background:var(--accent-hover); }
  input#search{
    width:100%; padding:12px 14px; font-size:1rem;
    border:1px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--text); margin:16px 0;
  }
  .toolbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:14px; font-size:0.85rem; color:var(--muted);
  }
  .toolbar button{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    padding:6px 12px; border-radius:6px; font-size:0.85rem; cursor:pointer;
  }
  .toolbar button:hover{ border-color:var(--accent); color:var(--accent); }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;
  }
  .company-card{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:14px;
  }
  .company-head{ text-align:center; margin-bottom:10px; }
  .company-head .name-zh{font-weight:600; font-size:0.95rem;}
  .company-head .name-en{color:var(--muted); font-size:0.8rem;}
  .variant-row{
    display:flex; flex-direction:column; gap:8px;
  }
  .variant{
    position:relative; border:1px solid var(--border); border-radius:8px;
    padding:10px 10px 8px; text-align:center; background:var(--bg);
  }
  .variant.selected{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .variant .check{
    position:absolute; top:6px; left:6px; width:16px; height:16px; cursor:pointer;
  }
  .variant img{
    max-width:100%; max-height:50px; object-fit:contain; margin-bottom:4px; margin-top:4px;
    background:repeating-conic-gradient(#ddd 0% 25%, transparent 0% 50%) 50%/14px 14px;
  }
  .variant .label{ font-size:0.72rem; color:var(--muted); }
  .variant .filetype{
    position:absolute; top:6px; right:6px; font-size:0.62rem; font-weight:700;
    padding:2px 6px; border-radius:4px; letter-spacing:0.02em;
    background:var(--accent); color:#fff; opacity:0.85;
  }
  .variant a{
    display:inline-block; margin-top:4px; font-size:0.72rem;
    color:var(--accent); text-decoration:none;
  }
  .pending{
    text-align:center; padding:14px; font-size:0.78rem; color:var(--muted);
    border:1px dashed var(--border); border-radius:8px;
  }
  .empty{color:var(--muted); text-align:center; padding:40px 0;}
  .fab-bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center; padding:14px;
    pointer-events:none;
  }
  .fab-inner{
    pointer-events:auto;
    background:var(--card); border:1px solid var(--border); border-radius:999px;
    padding:10px 18px; display:flex; align-items:center; gap:14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    font-size:0.9rem;
  }
  .fab-inner button{
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:8px 18px; font-size:0.9rem; cursor:pointer; font-weight:600;
  }
  .fab-inner button:hover{ background:var(--accent-hover); }
  .fab-inner button:disabled{ opacity:0.5; cursor:not-allowed; }
  .fab-inner .cancel{
    background:none; color:var(--muted); padding:8px 10px; font-weight:400;
  }
  .fab-inner .cancel:hover{ background:none; color:var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <div>
      <h1>品牌 Logo 素材庫</h1>
      <p class="sub">輸入中文名、英文名或別名搜尋；每家公司若有多個版本（直式/橫式等）會一併顯示，可勾選多筆打包下載</p>
    </div>
    <a class="claude-link" href="https://claude.ai/share/53f2f1bf-ec12-436e-a338-90ba17198327" target="_blank" rel="noopener">開始尋找/上傳 logo</a>
  </div>
  <input id="search" type="text" placeholder="例如：台積電 / TSMC">
  <div class="toolbar">
    <button id="selectAllBtn" type="button">全選目前結果</button>
    <button id="clearSelectBtn" type="button">清除選取</button>
    <span id="selCount">已選 0 筆</span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none;">沒有找到符合的 logo，下載後記得加進 index.json</div>
</div>

<div class="fab-bar" id="fabBar" style="display:none;">
  <div class="fab-inner">
    <span id="fabCount">已選 0 筆</span>
    <button class="cancel" id="fabCancel" type="button">取消</button>
    <button id="fabDownload" type="button">打包下載 (.zip)</button>
  </div>
</div>

<script>
let allCompanies = [];
let currentList = [];
const selected = new Set(); // key = 檔案路徑(唯一)

async function loadData(){
  try{
    const res = await fetch('index.json');
    const data = await res.json();
    allCompanies = data.companies || [];
    render(allCompanies);
  }catch(e){
    document.getElementById('grid').innerHTML =
      '<div class="empty">讀取 index.json 失敗</div>';
  }
}

function render(list){
  currentList = list;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  if(!list.length){ empty.style.display='block'; updateToolbar(); return; }
  empty.style.display='none';

  list.forEach(company=>{
    const card = document.createElement('div');
    card.className = 'company-card';

    const head = document.createElement('div');
    head.className = 'company-head';
    head.innerHTML = `
      <div class="name-zh">${company.中文名稱 || ''}</div>
      <div class="name-en">${company.英文名稱 || ''}</div>
    `;
    card.appendChild(head);

    const row = document.createElement('div');
    row.className = 'variant-row';

    const variants = company.variants || [];
    if(!variants.length){
      row.innerHTML = `<div class="pending">${company._狀態 || '待補檔案'}</div>`;
    } else {
      variants.forEach(v=>{
        const key = v.檔案;
        const ext = (key.split('.').pop() || '').toUpperCase();
        const div = document.createElement('div');
        div.className = 'variant' + (selected.has(key) ? ' selected' : '');
        div.innerHTML = `
          <input type="checkbox" class="check" data-key="${key}" ${selected.has(key) ? 'checked' : ''}>
          <span class="filetype">${ext}</span>
          <img src="${v.檔案}" alt="${company.中文名稱} ${v.標籤||''}" onerror="this.style.opacity=0.2">
          <div class="label">${v.標籤 || '標準版'}</div>
          <a href="${v.檔案}" download>下載</a>
        `;
        row.appendChild(div);
      });
    }
    card.appendChild(row);
    grid.appendChild(card);
  });

  grid.querySelectorAll('.check').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const key = e.target.dataset.key;
      if(e.target.checked){ selected.add(key); } else { selected.delete(key); }
      e.target.closest('.variant').classList.toggle('selected', e.target.checked);
      updateToolbar();
    });
  });

  updateToolbar();
}

function updateToolbar(){
  const n = selected.size;
  document.getElementById('selCount').textContent = `已選 ${n} 筆`;
  document.getElementById('fabCount').textContent = `已選 ${n} 筆`;
  document.getElementById('fabBar').style.display = n > 0 ? 'flex' : 'none';
}

document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ render(allCompanies); return; }
  const filtered = allCompanies.filter(company=>{
    const pool = [
      company.中文名稱, company.英文名稱, ...(company.別名||[])
    ].join(' ').toLowerCase();
    return pool.includes(q);
  });
  render(filtered);
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  currentList.forEach(company=>{
    (company.variants||[]).forEach(v=> selected.add(v.檔案));
  });
  render(currentList);
});

document.getElementById('clearSelectBtn').addEventListener('click', ()=>{
  selected.clear();
  render(currentList);
});
document.getElementById('fabCancel').addEventListener('click', ()=>{
  selected.clear();
  render(currentList);
});

document.getElementById('fabDownload').addEventListener('click', async (e)=>{
  const btn = e.target;
  const files = Array.from(selected);
  if(!files.length) return;
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = '打包中...';
  try{
    const zip = new JSZip();
    await Promise.all(files.map(async (file)=>{
      try{
        const res = await fetch(file);
        const blob = await res.blob();
        const filename = file.split('/').pop();
        zip.file(filename, blob);
      }catch(err){
        console.error('下載失敗:', file, err);
      }
    }));
    const content = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `logos_${ts}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    alert('打包失敗，請稍後再試');
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

loadData();
</script>
</body>
</html>
