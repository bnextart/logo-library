<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌 Logo 素材庫</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#fafafa; --card:#fff; --text:#1a1a1a; --muted:#6b6b6b;
    --border:#e5e5e5; --accent:#2563eb; --accent-hover:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121212; --card:#1c1c1c; --text:#f0f0f0; --muted:#9a9a9a;
      --border:#333; --accent:#60a5fa; --accent-hover:#3b82f6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121212; --card:#1c1c1c; --text:#f0f0f0; --muted:#9a9a9a;
    --border:#333; --accent:#60a5fa; --accent-hover:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px 16px 100px;
  }
  .wrap{max-width:900px; margin:0 auto;}
  h1{font-size:1.4rem; margin-bottom:4px;}
  p.sub{color:var(--muted); margin-top:0; font-size:0.9rem;}
  input#search{
    width:100%; padding:12px 14px; font-size:1rem;
    border:1px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--text); margin:16px 0;
  }
  .toolbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:14px; font-size:0.85rem; color:var(--muted);
  }
  .toolbar button{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    padding:6px 12px; border-radius:6px; font-size:0.85rem; cursor:pointer;
  }
  .toolbar button:hover{ border-color:var(--accent); color:var(--accent); }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;
  }
  .card{
    position:relative;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:14px; text-align:center;
  }
  .card.selected{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .card .check{
    position:absolute; top:8px; left:8px; width:18px; height:18px; cursor:pointer;
  }
  .card.disabled{ opacity:0.5; }
  .card img{
    max-width:100%; max-height:60px; object-fit:contain; margin-bottom:8px; margin-top:6px;
    background:repeating-conic-gradient(#ddd 0% 25%, transparent 0% 50%) 50%/16px 16px;
  }
  .card .name-zh{font-weight:600; font-size:0.95rem;}
  .card .name-en{color:var(--muted); font-size:0.8rem;}
  .card a{
    display:inline-block; margin-top:8px; font-size:0.8rem;
    color:var(--accent); text-decoration:none;
  }
  .empty{color:var(--muted); text-align:center; padding:40px 0;}
  .fab-bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center; padding:14px;
    pointer-events:none;
  }
  .fab-inner{
    pointer-events:auto;
    background:var(--card); border:1px solid var(--border); border-radius:999px;
    padding:10px 18px; display:flex; align-items:center; gap:14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    font-size:0.9rem;
  }
  .fab-inner button{
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:8px 18px; font-size:0.9rem; cursor:pointer; font-weight:600;
  }
  .fab-inner button:hover{ background:var(--accent-hover); }
  .fab-inner button:disabled{ opacity:0.5; cursor:not-allowed; }
  .fab-inner .cancel{
    background:none; color:var(--muted); padding:8px 10px; font-weight:400;
  }
  .fab-inner .cancel:hover{ background:none; color:var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <h1>品牌 Logo 素材庫</h1>
  <p class="sub">輸入中文名、英文名或別名搜尋；可勾選多筆一次打包下載</p>
  <input id="search" type="text" placeholder="例如：台積電 / TSMC">
  <div class="toolbar">
    <button id="selectAllBtn" type="button">全選目前結果</button>
    <button id="clearSelectBtn" type="button">清除選取</button>
    <span id="selCount">已選 0 筆</span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none;">沒有找到符合的 logo，下載後記得加進 index.json</div>
</div>

<div class="fab-bar" id="fabBar" style="display:none;">
  <div class="fab-inner">
    <span id="fabCount">已選 0 筆</span>
    <button class="cancel" id="fabCancel" type="button">取消</button>
    <button id="fabDownload" type="button">打包下載 (.zip)</button>
  </div>
</div>

<script>
let allLogos = [];
let currentList = [];
const selected = new Set(); // 存 key = 中文名稱_英文名稱

function itemKey(item){ return item.中文名稱 + '_' + item.英文名稱; }
function itemFile(item){ return (item.檔案 && (item.檔案.png || item.檔案.svg)) || ''; }

async function loadData(){
  try{
    const res = await fetch('index.json');
    const data = await res.json();
    allLogos = data.logos || [];
    render(allLogos);
  }catch(e){
    document.getElementById('grid').innerHTML =
      '<div class="empty">讀取 index.json 失敗</div>';
  }
}

function render(list){
  currentList = list;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  if(!list.length){ empty.style.display='block'; updateToolbar(); return; }
  empty.style.display='none';
  list.forEach(item=>{
    if(item._範例資料) return;
    const file = itemFile(item);
    const key = itemKey(item);
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(key) ? ' selected' : '') + (file ? '' : ' disabled');
    card.innerHTML = `
      ${file ? `<input type="checkbox" class="check" data-key="${key}" ${selected.has(key) ? 'checked' : ''}>` : ''}
      <img src="${file}" alt="${item.中文名稱}" onerror="this.style.opacity=0.2">
      <div class="name-zh">${item.中文名稱 || ''}</div>
      <div class="name-en">${item.英文名稱 || ''}</div>
      ${file ? `<a href="${file}" download>下載</a>` : '<div style="font-size:0.75rem;color:var(--muted);margin-top:6px;">待補檔案</div>'}
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.check').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const key = e.target.dataset.key;
      if(e.target.checked){ selected.add(key); } else { selected.delete(key); }
      e.target.closest('.card').classList.toggle('selected', e.target.checked);
      updateToolbar();
    });
  });

  updateToolbar();
}

function updateToolbar(){
  const n = selected.size;
  document.getElementById('selCount').textContent = `已選 ${n} 筆`;
  document.getElementById('fabCount').textContent = `已選 ${n} 筆`;
  document.getElementById('fabBar').style.display = n > 0 ? 'flex' : 'none';
}

document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ render(allLogos); return; }
  const filtered = allLogos.filter(item=>{
    const pool = [
      item.中文名稱, item.英文名稱, ...(item.別名||[])
    ].join(' ').toLowerCase();
    return pool.includes(q);
  });
  render(filtered);
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  currentList.forEach(item=>{
    if(item._範例資料) return;
    if(itemFile(item)) selected.add(itemKey(item));
  });
  render(currentList);
});

document.getElementById('clearSelectBtn').addEventListener('click', ()=>{
  selected.clear();
  render(currentList);
});
document.getElementById('fabCancel').addEventListener('click', ()=>{
  selected.clear();
  render(currentList);
});

document.getElementById('fabDownload').addEventListener('click', async (e)=>{
  const btn = e.target;
  const items = allLogos.filter(item => selected.has(itemKey(item)) && itemFile(item));
  if(!items.length) return;
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = '打包中...';
  try{
    const zip = new JSZip();
    await Promise.all(items.map(async (item)=>{
      const file = itemFile(item);
      try{
        const res = await fetch(file);
        const blob = await res.blob();
        const filename = file.split('/').pop();
        zip.file(filename, blob);
      }catch(err){
        console.error('下載失敗:', file, err);
      }
    }));
    const content = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `logos_${ts}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    alert('打包失敗，請稍後再試');
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

loadData();
</script>
</body>
</html>
